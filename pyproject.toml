[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ada305"
version = "0.2.1"
description = "Safe Linux control for Altec Lansing ADA305 USB speakers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SpeakerDrivers reverse-engineering project" }]
dependencies = ["pyusb>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ada305 = "ada305.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
